<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage | Tokyo Go!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navbar.css">
<style>
  :root {
    --navy: #17234a;
    --navy-soft: #24335f;
    --red: #c8352e;
    --red-dark: #a82a24;
    --pink: #f7d4dc;
    --pink-soft: #fdecef;
    --bg: #fefdfb;
    --ink: #17234a;
    --muted: #7a84a3;
    --line: #ece8e4;

    /* Background photo: set this to the SAME image your login/explore pages use */
    --hero-img: url("img/tokyo3.jpg");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      linear-gradient(180deg, rgba(23,35,74,.62) 0%, rgba(23,35,74,.45) 100%),
      var(--hero-img) center / cover no-repeat fixed,
      var(--navy); /* fallback if the photo is missing */
  }
  h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; }

  /* (navbar styles now come from navbar.css) */

  /* ---------- layout ---------- */
  .wrap {
    max-width: 1180px;
    margin: 48px auto;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 36px;
    align-items: start;
  }

  /* ---------- sidebar ---------- */
  aside {
    background: #fff;
    border-radius: 24px;
    padding: 28px 22px;
    box-shadow: 0 10px 40px rgba(0,0,0,.22);
    border: 1px solid var(--line);
  }
  aside h2 { font-size: 1.5rem; margin-bottom: 18px; }
  #tripList { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .trip-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    transition: all .2s;
    font-weight: 500;
  }
  .trip-item:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(23,35,74,.08); }
  .trip-item.active {
    border-color: transparent;
    border-left: 5px solid #f4a9b8;
    background: var(--pink-soft);
  }
  .trip-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn {
    background: none; border: none; cursor: pointer; color: var(--muted);
    padding: 6px; border-radius: 8px; display: grid; place-items: center;
    transition: all .2s;
  }
  .icon-btn:hover { color: var(--red); background: #fff; }
  .empty { color: var(--muted); font-size: .9rem; padding: 6px 2px; }

  /* ---------- main ---------- */
  main { min-height: 420px; }
  .create-btn {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 16px 34px;
    border-radius: 999px;
    font: 700 1.05rem 'DM Sans', sans-serif;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(200,53,46,.4);
    transition: all .2s;
  }
  .create-btn:hover { background: var(--red-dark); transform: translateY(-2px); }

  .card {
    margin-top: 34px;
    background: #fff;
    border-radius: 24px;
    border: 1px solid var(--line);
    border-left: 6px solid #f4a9b8;
    padding: 30px 34px;
    max-width: 560px;
    box-shadow: 0 10px 40px rgba(0,0,0,.22);
  }
  .card h3 { font-size: 1.9rem; margin-bottom: 18px; }
  .row { display: flex; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .row .label { width: 110px; color: var(--muted); font-size: .9rem; }
  .row .value { font-weight: 500; }
  .card .actions { margin-top: 22px; display: flex; gap: 12px; }
  .btn-open {
    background: var(--navy); color: #fff; text-decoration: none;
    padding: 12px 26px; border-radius: 999px; font-weight: 700; font-size: .95rem;
    transition: background .2s;
  }
  .btn-open:hover { background: var(--navy-soft); }
  .placeholder {
    margin-top: 34px; padding: 40px; border: 2px dashed var(--pink);
    background: rgba(255,255,255,.92);
    border-radius: 24px; color: var(--muted); max-width: 560px; text-align: center;
  }

  /* ---------- modal (z-index above the fixed navbar) ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(23,35,74,.45);
    display: none; place-items: center; z-index: 200; backdrop-filter: blur(3px);
  }
  .overlay.show { display: grid; }
  .modal {
    background: #fff; width: min(440px, 92vw); border-radius: 24px; padding: 34px;
    box-shadow: 0 24px 60px rgba(0,0,0,.25);
  }
  .modal h2 { font-size: 1.7rem; margin-bottom: 20px; }
  .modal label { display: block; font-weight: 700; font-size: .85rem; margin: 14px 0 6px; }
  .modal input {
    width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
    font: inherit; color: var(--ink); background: #fff;
  }
  .modal input:focus { outline: 2px solid var(--pink); border-color: var(--red); }
  .modal .btns { display: flex; gap: 10px; margin-top: 26px; }
  .modal .btns button { flex: 1; padding: 14px; border-radius: 999px; font: 700 .95rem 'DM Sans'; cursor: pointer; border: none; }
  .btn-save { background: var(--red); color: #fff; }
  .btn-save:hover { background: var(--red-dark); }
  .btn-cancel { background: var(--pink-soft); color: var(--ink); }
  .error { color: var(--red); font-size: .85rem; margin-top: 10px; min-height: 1em; }

  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="page">

<nav>
  <a class="logo" href="index.html">Tokyo<span>Go!</span></a>
  <button class="menu" aria-label="Open menu" onclick="document.getElementById('links').classList.toggle('open')">☰</button>
  <ul id="links">
    <li><a href="index.html">Home</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="manage.html" class="active">Itinerary</a></li>
    <li><a href="users.html">Profile</a></li>
    <li><a href="login.html">Log out</a></li>
  </ul>
</nav>

<div class="wrap">
  <aside>
    <h2>My trip</h2>
    <ul id="tripList"></ul>
  </aside>

  <main>
    <button class="create-btn" id="openCreate">Create +</button>
    <div id="detail"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <form class="modal" id="tripForm">
    <h2>New trip</h2>
    <label for="tName">Trip name</label>
    <input id="tName" type="text" placeholder="e.g. Tokyo" required>
    <label for="tStart">Start date</label>
    <input id="tStart" type="date" required>
    <label for="tEnd">End date</label>
    <input id="tEnd" type="date" required>
    <div class="error" id="formError"></div>
    <div class="btns">
      <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn-save">Create</button>
    </div>
  </form>
</div>

<script>
  const KEY = 'tokyogo_trips';
  const trash = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';

  let trips = [];
  try { trips = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  if (!trips.length) trips = [{ id: 't1', name: 'Tokyo', start: '2026-05-13', end: '2026-05-15' }];
  let selected = trips[0].id;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(trips)); } catch (e) {} };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

  function render() {
    const list = document.getElementById('tripList');
    list.innerHTML = trips.length ? '' : '<li class="empty">No trips yet</li>';
    trips.forEach(t => {
      const li = document.createElement('li');
      li.className = 'trip-item' + (t.id === selected ? ' active' : '');
      li.innerHTML = `<span class="name">${esc(t.name)}</span><button class="icon-btn" title="Delete trip" aria-label="Delete ${esc(t.name)}">${trash}</button>`;
      li.addEventListener('click', () => { selected = t.id; render(); });
      li.querySelector('button').addEventListener('click', e => {
        e.stopPropagation();
        if (!confirm(`Delete "${t.name}"?`)) return;
        trips = trips.filter(x => x.id !== t.id);
        if (selected === t.id) selected = trips[0]?.id;
        save(); render();
      });
      list.appendChild(li);
    });

    const t = trips.find(x => x.id === selected);
    const detail = document.getElementById('detail');
    detail.innerHTML = t ? `
      <div class="card">
        <h3>${esc(t.name)}</h3>
        <div class="row"><span class="label">Trip name</span><span class="value">${esc(t.name)}</span></div>
        <div class="row"><span class="label">Start date</span><span class="value">${fmt(t.start)}</span></div>
        <div class="row"><span class="label">End date</span><span class="value">${fmt(t.end)}</span></div>
        <div class="actions"><a class="btn-open" href="itinerary.html?trip=${encodeURIComponent(t.id)}">Open itinerary →</a></div>
      </div>` : '<div class="placeholder">Create your first trip to get started.</div>';
  }

  const overlay = document.getElementById('overlay');
  const form = document.getElementById('tripForm');
  const err = document.getElementById('formError');
  const close = () => { overlay.classList.remove('show'); form.reset(); err.textContent = ''; };

  document.getElementById('openCreate').onclick = () => { overlay.classList.add('show'); document.getElementById('tName').focus(); };
  document.getElementById('cancelBtn').onclick = close;
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('tName').value.trim();
    const start = document.getElementById('tStart').value;
    const end = document.getElementById('tEnd').value;
    if (end < start) { err.textContent = 'End date must be on or after the start date.'; return; }
    const trip = { id: 't' + Date.now(), name, start, end };
    trips.push(trip); selected = trip.id;
    save(); close(); render();
  });

  render();
</script>
</body>
</html>
