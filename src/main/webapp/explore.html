<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore | TokyoGo!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navbar.css">
<style>
  :root {
    --navy: #1e2150;
    --navy-dark: #151740;
    --red: #c8352f;
    --pink: #f4a6b8;
    --bg: #f3f0f7;
    --card: #ffffff;
    --text: #1e2150;
    --muted: #6b6b86;
    --line: #e2dded;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; }

  /* (navbar styles now come from navbar.css) */

  /* PAGE HEAD + TABS */
  .page-head {
    background: linear-gradient(135deg, var(--navy-dark), var(--navy));
    color: #fff; padding: 44px 24px 0;
  }
  .page-head .inner { max-width: 1200px; margin: 0 auto; }
  .page-head h1 { font-size: 2.6rem; }
  .page-head p { margin-top: 8px; opacity: .8; }
  .tabs { display: flex; gap: 6px; margin-top: 28px; }
  .tab {
    background: transparent; border: none; color: #fff; opacity: .7;
    padding: 14px 28px; font-size: 1rem; font-weight: 600; cursor: pointer;
    border-bottom: 4px solid transparent; font-family: inherit;
  }
  .tab:hover { opacity: 1; }
  .tab.active { opacity: 1; border-bottom-color: var(--red); }

  /* LAYOUT */
  .layout {
    max-width: 1200px; margin: 36px auto 60px; padding: 0 24px;
    display: grid; grid-template-columns: 250px 1fr; gap: 32px; align-items: start;
  }

  /* FILTER */
  .filter {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 22px; position: sticky; top: 88px; /* sits below the fixed navbar */
  }
  .filter h3 { font-size: 1.3rem; padding-bottom: 12px; border-bottom: 3px solid var(--red); display: inline-block; margin-bottom: 18px; }
  .field { margin-bottom: 20px; }
  .field .title { display: block; font-weight: 700; font-size: .85rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  select {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: .95rem; font-family: inherit;
  }
  .radio { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: .95rem; cursor: pointer; }
  .radio input { accent-color: var(--red); }
  .reset {
    width: 100%; padding: 10px; border-radius: 999px; border: 1px solid var(--navy);
    background: transparent; color: var(--navy); font-weight: 600; cursor: pointer; font-family: inherit;
  }
  .reset:hover { background: var(--navy); color: #fff; }

  /* RESULTS */
  .results-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .results-head h2 { font-size: 2rem; }
  .results-head span { color: var(--muted); font-size: .9rem; }
  .underline { width: 60px; height: 4px; background: var(--red); border-radius: 2px; margin-bottom: 26px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px; }
  .card {
    background: var(--card); border-radius: 18px; overflow: hidden; cursor: pointer;
    box-shadow: 0 4px 16px rgba(30,33,80,.08); transition: transform .2s, box-shadow .2s;
    display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-5px); box-shadow: 0 12px 28px rgba(30,33,80,.18); }
  .card .photo {
    height: 180px; display: flex; align-items: flex-end; padding: 12px;
    background-size: cover; background-position: center;
  }
  .badge {
    background: rgba(21,23,64,.85); color: #fff; font-size: .75rem; font-weight: 700;
    padding: 5px 12px; border-radius: 999px; letter-spacing: .05em;
  }
  .card .body { padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .card h3 { font-size: 1.25rem; }
  .meta { display: flex; justify-content: space-between; font-size: .88rem; color: var(--muted); }
  .rating { color: var(--red); font-weight: 700; }
  .desc { font-size: .9rem; line-height: 1.5; color: #44446a; }
  .foot {
    margin-top: auto; padding-top: 12px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center; font-size: .82rem; color: var(--muted);
  }
  .foot .login-hint { color: var(--red); font-weight: 700; }
  .empty { grid-column: 1 / -1; text-align: center; padding: 50px; color: var(--muted); }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
    .filter { position: static; }
  }
</style>
</head>
<body class="page">

<nav>
  <a class="logo" href="index.html">Tokyo<span>Go!</span></a>
  <button class="menu" aria-label="Open menu" onclick="document.getElementById('links').classList.toggle('open')">☰</button>
  <ul id="links">
    <li><a href="index.html">Home</a></li>
    <li><a href="explore.html" class="active">Explore</a></li>
    <li><a href="manage.html">Itinerary</a></li>
    <li><a href="users.html">Profile</a></li>
    <li><a href="login.html">Login</a></li>
  </ul>
</nav>

<section class="page-head">
  <div class="inner">
    <h1>Explore Tokyo</h1>
    <p>Find the places and food worth adding to your trip.</p>
    <div class="tabs">
      <button class="tab active" data-type="place">Places</button>
      <button class="tab" data-type="food">Food</button>
    </div>
  </div>
</section>

<main class="layout">
  <!-- FILTER -->
  <aside class="filter">
    <h3>Filter</h3>

    <div class="field">
      <label class="title" for="area">Area</label>
      <select id="area">
        <option value="all">All areas</option>
        <option>Asakusa</option>
        <option>Shibuya</option>
        <option>Shinjuku</option>
        <option>Harajuku</option>
        <option>Akihabara</option>
        <option>Minato</option>
      </select>
    </div>

    <div class="field">
      <label class="title" for="rating">Rating</label>
      <select id="rating">
        <option value="0">Any rating</option>
        <option value="4.5">4.5 &amp; up</option>
        <option value="4">4.0 &amp; up</option>
        <option value="3.5">3.5 &amp; up</option>
      </select>
    </div>

    <div class="field">
      <span class="title">Price</span>
      <label class="radio"><input type="radio" name="price" data-min="0" data-max="999999" checked> All prices</label>
      <label class="radio"><input type="radio" name="price" data-min="0" data-max="0"> Free</label>
      <label class="radio"><input type="radio" name="price" data-min="1" data-max="1000"> ¥1 – ¥1,000</label>
      <label class="radio"><input type="radio" name="price" data-min="1001" data-max="3000"> ¥1,001 – ¥3,000</label>
      <label class="radio"><input type="radio" name="price" data-min="3001" data-max="5000"> ¥3,001 – ¥5,000</label>
      <label class="radio"><input type="radio" name="price" data-min="5001" data-max="999999"> Over ¥5,000</label>
    </div>

    <button class="reset" id="reset">Reset filters</button>
  </aside>

  <!-- RESULTS -->
  <section>
    <div class="results-head">
      <h2 id="heading">Places in Tokyo</h2>
      <span id="count"></span>
    </div>
    <div class="underline"></div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
  // Sample data - replace with your own (or load from your backend)
  const items = [
    { type:"place", name:"Senso-ji Temple", area:"Asakusa", price:0, rating:4.7,
      desc:"Tokyo's oldest temple, with the famous Kaminarimon gate and Nakamise shopping street.",
      hours:"6:00 AM – 5:00 PM", grad:"#c8352f,#1e2150" },
    { type:"place", name:"Shibuya Crossing", area:"Shibuya", price:0, rating:4.6,
      desc:"The world's busiest scramble crossing. Best seen from the Shibuya Sky deck at dusk.",
      hours:"Open 24 hours", grad:"#1e2150,#4a3f9f" },
    { type:"place", name:"Meiji Jingu", area:"Harajuku", price:0, rating:4.8,
      desc:"A calm forest shrine in the middle of the city, dedicated to Emperor Meiji.",
      hours:"5:00 AM – 6:00 PM", grad:"#2f6b4f,#1e2150" },
    { type:"place", name:"Tokyo Tower", area:"Minato", price:1500, rating:4.4,
      desc:"The iconic red-and-white tower with observation decks and night illumination.",
      hours:"9:00 AM – 11:00 PM", grad:"#e0533d,#151740" },
    { type:"place", name:"teamLab Planets", area:"Minato", price:3800, rating:4.7,
      desc:"A walk-through digital art museum. Expect to get barefoot and wet up to your knees.",
      hours:"9:00 AM – 10:00 PM", grad:"#2ab7ca,#4a3f9f" },
    { type:"place", name:"Akihabara Electric Town", area:"Akihabara", price:0, rating:4.3,
      desc:"Anime, retro games, arcades and electronics stores packed into a few neon blocks.",
      hours:"10:00 AM – 9:00 PM", grad:"#f4a6b8,#1e2150" },
    { type:"place", name:"Shinjuku Gyoen", area:"Shinjuku", price:500, rating:4.6,
      desc:"A large garden with Japanese, French and English landscapes. Great for cherry blossoms.",
      hours:"9:00 AM – 4:30 PM", grad:"#6bb36b,#1e2150" },

    { type:"food", name:"Ichiran Ramen", area:"Shibuya", price:1100, rating:4.5,
      desc:"Tonkotsu ramen eaten in a private booth. Customise spice, noodles and richness.",
      hours:"10:00 AM – 12:00 AM", grad:"#d9822b,#151740" },
    { type:"food", name:"Sushi Dai Style Counter", area:"Minato", price:8000, rating:4.8,
      desc:"Omakase sushi with fish fresh from the market, served piece by piece.",
      hours:"11:00 AM – 9:00 PM", grad:"#c8352f,#f4a6b8" },
    { type:"food", name:"Nakamise Street Snacks", area:"Asakusa", price:500, rating:4.2,
      desc:"Melon pan, ningyo-yaki and senbei crackers to eat while walking to the temple.",
      hours:"10:00 AM – 6:00 PM", grad:"#e0a63d,#1e2150" },
    { type:"food", name:"Omoide Yokocho Yakitori", area:"Shinjuku", price:2500, rating:4.4,
      desc:"Smoky alleyway of tiny grill bars. Squeeze in, order skewers and a cold beer.",
      hours:"5:00 PM – 12:00 AM", grad:"#7a2e1f,#151740" },
    { type:"food", name:"Harajuku Crepes", area:"Harajuku", price:700, rating:4.1,
      desc:"Colourful sweet crepes on Takeshita Street, stuffed with cream, fruit and cake.",
      hours:"10:00 AM – 8:00 PM", grad:"#f4a6b8,#4a3f9f" }
  ];

  const formatYen = p => p === 0 ? "Free" : "¥" + p.toLocaleString("en-US");

  let currentType = "place";
  const grid = document.getElementById("grid");
  const areaEl = document.getElementById("area");
  const ratingEl = document.getElementById("rating");

  function render() {
    const area = areaEl.value;
    const minRating = parseFloat(ratingEl.value);
    const priceEl = document.querySelector('input[name="price"]:checked');
    const minPrice = parseInt(priceEl.dataset.min, 10);
    const maxPrice = parseInt(priceEl.dataset.max, 10);

    const list = items.filter(i =>
      i.type === currentType &&
      (area === "all" || i.area === area) &&
      i.rating >= minRating &&
      i.price >= minPrice && i.price <= maxPrice
    );

    document.getElementById("heading").textContent =
      currentType === "place" ? "Places in Tokyo" : "Food in Tokyo";
    document.getElementById("count").textContent = list.length + " result" + (list.length === 1 ? "" : "s");

    if (!list.length) {
      grid.innerHTML = '<div class="empty">No results match your filters.</div>';
      return;
    }

    grid.innerHTML = list.map(i => `
      <article class="card" onclick="location.href='login.html'" title="Log in to save this">
        <div class="photo" style="background-image:linear-gradient(160deg, ${i.grad.split(',')[0]}, ${i.grad.split(',')[1]})">
          <span class="badge">TOKYO</span>
        </div>
        <div class="body">
          <h3>${i.name}</h3>
          <div class="meta">
            <span>📍 ${i.area}</span>
            <span>${formatYen(i.price)}</span>
            <span class="rating">★ ${i.rating.toFixed(1)}</span>
          </div>
          <p class="desc">${i.desc}</p>
          <div class="foot">
            <span>🕒 ${i.hours}</span>
            <span class="login-hint">Log in to save →</span>
          </div>
        </div>
      </article>
    `).join("");
  }

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.dataset.type;
      render();
    });
  });

  areaEl.addEventListener("change", render);
  ratingEl.addEventListener("change", render);
  document.querySelectorAll('input[name="price"]').forEach(r => r.addEventListener("change", render));
  document.getElementById("reset").addEventListener("click", () => {
    areaEl.value = "all";
    ratingEl.value = "0";
    document.querySelector('input[name="price"]').checked = true;
    render();
  });

  render();
</script>
</body>
</html>
