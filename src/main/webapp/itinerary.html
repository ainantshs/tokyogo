<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary | Tokyo Go!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navbar.css">
<style>
  :root {
    --navy: #17234a;
    --navy-soft: #24335f;
    --red: #c8352e;
    --red-dark: #a82a24;
    --pink: #f7d4dc;
    --pink-soft: #fdecef;
    --pink-accent: #f4a9b8;
    --bg: #fefdfb;
    --ink: #17234a;
    --muted: #7a84a3;
    --line: #ece8e4;

    /* Background photo: set this to the SAME image your login/explore pages use */
    --hero-img: url("img/tokyo2.jpg");
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background:
      linear-gradient(180deg, rgba(23,35,74,.62) 0%, rgba(23,35,74,.45) 100%),
      var(--hero-img) center / cover no-repeat fixed,
      var(--navy); /* fallback if the photo is missing */
  }
  h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 500; }

  /* (navbar styles now come from navbar.css) */

  /* ---------- layout ---------- */
  .wrap {
    max-width: 1180px; margin: 48px auto; padding: 0 24px;
    display: grid; grid-template-columns: 1fr 400px; gap: 40px; align-items: start;
  }

  /* left column sits on a frosted white panel so text stays readable over the photo */
  .wrap > section {
    background: rgba(255,255,255,.94);
    border-radius: 28px;
    padding: 32px 34px 36px;
    box-shadow: 0 10px 40px rgba(0,0,0,.22);
  }

  /* ---------- back link ---------- */
  .back-link {
    display: inline-block; margin-bottom: 18px; color: var(--muted); text-decoration: none;
    font-weight: 700; font-size: .9rem; transition: color .2s;
  }
  .back-link:hover { color: var(--red); }

  h1 { font-size: clamp(2rem, 4vw, 3.1rem); padding-bottom: 14px; border-bottom: 1px dashed var(--line); margin-bottom: 22px; }

  /* ---------- dates ---------- */
  .dates { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .dates input {
    padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line);
    font: inherit; color: var(--ink); background: #fff; cursor: pointer;
  }
  .dates input:focus { outline: 2px solid var(--pink); border-color: var(--red); }
  .dates .dash { color: var(--muted); }
  .hint { margin-top: 10px; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .hint.err { color: var(--red); }

  /* ---------- day pills ---------- */
  .days { display: flex; gap: 12px; flex-wrap: wrap; margin: 24px 0; }
  .day {
    padding: 14px 28px; border-radius: 999px; border: 1px solid var(--line); background: #fff;
    font: 500 1rem 'DM Sans'; color: var(--ink); cursor: pointer; transition: all .2s;
  }
  .day:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(23,35,74,.08); }
  .day.active { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 8px 20px rgba(200,53,46,.3); }
  .day small { display: block; font-size: .7rem; opacity: .75; font-weight: 400; margin-top: 1px; }

  .day-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; color: var(--muted); font-size: .9rem; }
  .day-head strong { color: var(--ink); font-weight: 700; }

  /* ---------- activities ---------- */
  #activities { display: flex; flex-direction: column; gap: 14px; }
  .act {
    display: flex; align-items: center; gap: 22px; background: #fff;
    border: 1px solid var(--line); border-left: 5px solid var(--pink-accent);
    border-radius: 20px; padding: 20px 24px; box-shadow: 0 6px 24px rgba(23,35,74,.05);
    animation: pop .25s ease;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .act .time { color: var(--red); font-weight: 500; font-size: .95rem; min-width: 110px; padding-right: 22px; border-right: 1px solid var(--line); }
  .act .info { flex: 1; min-width: 0; }
  .act .info h3 { font-size: 1.3rem; }
  .act .info p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
  .price { background: var(--pink-soft); color: var(--red); font-weight: 700; font-size: .85rem; padding: 7px 14px; border-radius: 999px; white-space: nowrap; }
  .icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 8px; border-radius: 10px; display: grid; place-items: center; transition: all .2s; }
  .icon-btn:hover { color: var(--red); background: var(--pink-soft); }
  .empty { padding: 40px; border: 2px dashed var(--pink); border-radius: 24px; color: var(--muted); text-align: center; }

  /* ---------- side column ---------- */
  .total {
    background: var(--navy); color: #fff; border-radius: 24px; padding: 34px 32px;
    display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.3);
  }
  .total span { font-weight: 700; }
  .total strong { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 500; color: var(--pink-accent); }

  .panel { margin-top: 24px; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 34px 32px; box-shadow: 0 10px 40px rgba(0,0,0,.22); }
  .panel h2 { font-size: 1.9rem; margin-bottom: 22px; }
  .panel label { display: block; font-weight: 700; font-size: .85rem; margin: 16px 0 8px; }
  .panel select, .panel input[type=time] {
    width: 100%; padding: 15px 16px; border-radius: 16px; border: 1px solid var(--line);
    font: inherit; color: var(--ink); background: #fff;
  }
  .panel select:focus, .panel input:focus { outline: 2px solid var(--pink); border-color: var(--red); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--pink-soft); border-radius: 999px; padding: 4px; }
  .seg button { border: none; background: none; padding: 11px; border-radius: 999px; font: 700 .9rem 'DM Sans'; color: var(--muted); cursor: pointer; transition: all .2s; }
  .seg button.on { background: #fff; color: var(--red); box-shadow: 0 2px 8px rgba(23,35,74,.1); }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .add-btn {
    width: 100%; margin-top: 26px; background: var(--red); color: #fff; border: none; padding: 18px;
    border-radius: 16px; font: 700 1.05rem 'DM Sans'; cursor: pointer; box-shadow: 0 8px 20px rgba(200,53,46,.28); transition: all .2s;
  }
  .add-btn:hover { background: var(--red-dark); transform: translateY(-2px); }
  .form-err { color: var(--red); font-size: .85rem; margin-top: 12px; min-height: 1.1em; }

  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  @media (max-width: 520px) {
    .wrap > section { padding: 24px 18px 28px; }
    .act { flex-wrap: wrap; gap: 12px; }
    .act .time { border: none; padding: 0; }
  }
</style>
</head>
<body class="page">

<nav>
  <a class="logo" href="index.html">Tokyo<span>Go!</span></a>
  <button class="menu" aria-label="Open menu" onclick="document.getElementById('links').classList.toggle('open')">☰</button>
  <ul id="links">
    <li><a href="index.html">Home</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="manage.html" class="active">Itinerary</a></li>
    <li><a href="users.html">Profile</a></li>
    <li><a href="login.html">Log out</a></li>
  </ul>
</nav>

<div class="wrap">
  <section>
    <a class="back-link" href="manage.html">← Back to my trips</a>
    <h1 id="title">My Tokyo trip</h1>

    <div class="dates">
      <input type="date" id="startDate" aria-label="Start date">
      <span class="dash">–</span>
      <input type="date" id="endDate" aria-label="End date">
    </div>
    <div class="hint" id="dateHint">Days are generated from these dates.</div>

    <div class="days" id="days"></div>
    <div class="day-head" id="dayHead"></div>
    <div id="activities"></div>
  </section>

  <aside>
    <div class="total"><span>total price</span><strong id="total">¥0</strong></div>

    <div class="panel">
      <h2>add activity</h2>

      <div class="seg" id="seg">
        <button type="button" class="on" data-cat="place">Places</button>
        <button type="button" data-cat="food">Food</button>
      </div>

      <label for="placeSelect">Place name</label>
      <select id="placeSelect"></select>

      <div class="times">
        <div>
          <label for="startTime">Start time</label>
          <input type="time" id="startTime" value="09:00">
        </div>
        <div>
          <label for="endTime">End time</label>
          <input type="time" id="endTime" value="11:00">
        </div>
      </div>

      <button class="add-btn" id="addBtn">add to day 1</button>
      <div class="form-err" id="formErr"></div>
    </div>
  </aside>
</div>

<script>
  /* Prices are rough estimates in yen (0 = free). */
  const PLACES = [
    { id: 'meiji',   cat: 'place', name: 'Meiji Shrine',          area: 'Shrine in Harajuku',        price: 0 },
    { id: 'sensoji', cat: 'place', name: 'Senso-ji Temple',       area: 'Temple in Asakusa',         price: 0 },
    { id: 'takeshita', cat: 'place', name: 'Takeshita Street',    area: 'Shopping street, Harajuku', price: 0 },
    { id: 'akiba',   cat: 'place', name: 'Akihabara',             area: 'Electric Town',             price: 0 },
    { id: 'gyoen',   cat: 'place', name: 'Shinjuku Gyoen',        area: 'Garden in Shinjuku',        price: 500 },
    { id: 'ueno',    cat: 'place', name: 'Ueno Zoo',              area: 'Zoo in Ueno Park',          price: 600 },
    { id: 'tower',   cat: 'place', name: 'Tokyo Tower',           area: 'Main deck, Minato',         price: 1200 },
    { id: 'skytree', cat: 'place', name: 'Tokyo Skytree',         area: 'Observation deck, Sumida',  price: 2100 },
    { id: 'sky',     cat: 'place', name: 'Shibuya Sky',           area: 'Rooftop, Shibuya',          price: 2200 },
    { id: 'teamlab', cat: 'place', name: 'teamLab Planets',       area: 'Digital art, Toyosu',       price: 3800 },
    { id: 'ichiran', cat: 'food',  name: 'Ichiran Ramen',         area: 'Ramen in Shibuya',          price: 1300 },
    { id: 'tsukiji', cat: 'food',  name: 'Tsukiji Outer Market',  area: 'Street food in Chuo',       price: 2000 },
    { id: 'sushi',   cat: 'food',  name: 'Conveyor Belt Sushi',   area: 'Sushi in Shinjuku',         price: 2500 },
    { id: 'tonkatsu',cat: 'food',  name: 'Tonkatsu Lunch',        area: 'Set meal in Ginza',         price: 1800 },
    { id: 'izakaya', cat: 'food',  name: 'Izakaya Dinner',        area: 'Yakitori in Yurakucho',     price: 4000 },
  ];
  const byId = Object.fromEntries(PLACES.map(p => [p.id, p]));

  const yen = n => n === 0 ? 'Free' : '¥' + n.toLocaleString();
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const $ = id => document.getElementById(id);
  const trash = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';

  /* ---------- load the trip chosen on the manage page ---------- */
  const TRIPS_KEY = 'tokyogo_trips';
  let trips = [];
  try { trips = JSON.parse(localStorage.getItem(TRIPS_KEY)) || []; } catch (e) {}
  if (!trips.length) trips = [{ id: 't1', name: 'Tokyo', start: '2026-05-13', end: '2026-05-15' }];

  const tripId = new URLSearchParams(location.search).get('trip');
  const trip = trips.find(t => t.id === tripId) || trips[0];

  const ACT_KEY = 'tokyogo_activities_' + trip.id;
  let acts = [];
  try { acts = JSON.parse(localStorage.getItem(ACT_KEY)) || []; } catch (e) {}
  if (!acts.length && trip.id === 't1' && !localStorage.getItem(ACT_KEY)) {
    acts = [{ id: 'a1', day: 0, place: 'meiji', start: '09:00', end: '11:00' }];
  }

  let currentDay = 0;
  let category = 'place';

  const saveTrips = () => { try { localStorage.setItem(TRIPS_KEY, JSON.stringify(trips)); } catch (e) {} };
  const saveActs  = () => { try { localStorage.setItem(ACT_KEY, JSON.stringify(acts)); } catch (e) {} };

  /* ---------- dates & days ---------- */
  const MAX_DAYS = 14;
  const parse = d => new Date(d + 'T00:00:00');
  const dayCount = () => Math.min(MAX_DAYS, Math.max(1, Math.round((parse(trip.end) - parse(trip.start)) / 864e5) + 1));
  const dayDate = i => { const d = parse(trip.start); d.setDate(d.getDate() + i); return d; };

  function renderDays() {
    const n = dayCount();
    if (currentDay >= n) currentDay = 0;
    $('days').innerHTML = '';
    for (let i = 0; i < n; i++) {
      const b = document.createElement('button');
      b.className = 'day' + (i === currentDay ? ' active' : '');
      b.innerHTML = `day ${i + 1}<small>${dayDate(i).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</small>`;
      b.onclick = () => { currentDay = i; render(); };
      $('days').appendChild(b);
    }
    $('addBtn').textContent = `add to day ${currentDay + 1}`;
  }

  /* ---------- activities ---------- */
  const t12 = t => { const [h, m] = t.split(':').map(Number); return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`; };

  function renderActs() {
    const n = dayCount();
    const todays = acts.filter(a => a.day === currentDay).sort((a, b) => a.start.localeCompare(b.start));
    const list = $('activities');
    list.innerHTML = '';

    const dayTotal = todays.reduce((s, a) => s + (byId[a.place]?.price || 0), 0);
    $('dayHead').innerHTML = `<strong>${dayDate(currentDay).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</strong><span>Day total: ${dayTotal ? '¥' + dayTotal.toLocaleString() : 'Free'}</span>`;

    if (!todays.length) {
      list.innerHTML = '<div class="empty">Nothing planned for this day yet. Add an activity on the right.</div>';
    }
    todays.forEach(a => {
      const p = byId[a.place]; if (!p) return;
      const el = document.createElement('div');
      el.className = 'act';
      el.innerHTML = `
        <div class="time">${t12(a.start)} – ${t12(a.end)}</div>
        <div class="info"><h3>${esc(p.name)}</h3><p>${esc(p.area)}</p></div>
        <span class="price">${yen(p.price)}</span>
        <button class="icon-btn" title="Remove" aria-label="Remove ${esc(p.name)}">${trash}</button>`;
      el.querySelector('button').onclick = () => { acts = acts.filter(x => x.id !== a.id); saveActs(); render(); };
      list.appendChild(el);
    });

    const total = acts.filter(a => a.day < n).reduce((s, a) => s + (byId[a.place]?.price || 0), 0);
    $('total').textContent = '¥' + total.toLocaleString();
  }

  /* ---------- add-activity panel ---------- */
  function fillPlaces() {
    $('placeSelect').innerHTML = PLACES.filter(p => p.cat === category)
      .map(p => `<option value="${p.id}">${esc(p.name)} (${yen(p.price)})</option>`).join('');
  }
  document.querySelectorAll('#seg button').forEach(b => b.onclick = () => {
    category = b.dataset.cat;
    document.querySelectorAll('#seg button').forEach(x => x.classList.toggle('on', x === b));
    fillPlaces();
  });

  $('addBtn').onclick = () => {
    const place = $('placeSelect').value, start = $('startTime').value, end = $('endTime').value;
    const err = $('formErr');
    if (!place || !start || !end) { err.textContent = 'Pick a place and both times.'; return; }
    if (end <= start) { err.textContent = 'End time must be after the start time.'; return; }
    const clash = acts.find(a => a.day === currentDay && start < a.end && end > a.start);
    if (clash) { err.textContent = `That overlaps with ${byId[clash.place].name} (${clash.start}–${clash.end}).`; return; }
    err.textContent = '';
    acts.push({ id: 'a' + Date.now(), day: currentDay, place, start, end });
    saveActs(); render();
  };

  /* ---------- date inputs ---------- */
  function setDates() {
    const s = $('startDate').value, e = $('endDate').value, hint = $('dateHint');
    if (!s || !e) return;
    if (e < s) { hint.textContent = 'End date must be on or after the start date.'; hint.className = 'hint err'; return; }
    const span = Math.round((parse(e) - parse(s)) / 864e5) + 1;
    hint.className = 'hint';
    hint.textContent = span > MAX_DAYS ? `Showing the first ${MAX_DAYS} days of ${span}.` : `${span} day${span > 1 ? 's' : ''} planned.`;
    trip.start = s; trip.end = e;
    const i = trips.findIndex(t => t.id === trip.id); if (i >= 0) trips[i] = trip;
    saveTrips(); render();
  }
  $('startDate').onchange = setDates;
  $('endDate').onchange = setDates;

  function render() { renderDays(); renderActs(); }

  /* ---------- init ---------- */
  $('title').textContent = `My ${trip.name} trip`;
  document.title = `${trip.name} | Tokyo Go!`;
  $('startDate').value = trip.start;
  $('endDate').value = trip.end;
  fillPlaces();
  render();
  setDates();
</script>
</body>
</html>
