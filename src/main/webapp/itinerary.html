<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinerary | Tokyo Go!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="itinerary.css">
</head>
<body class="page">

<nav>
  <a class="logo" href="index.html">Tokyo<span>Go!</span></a>
  <button class="menu" aria-label="Open menu">☰</button>
  <ul id="links">
    <li><a href="index.html">Home</a></li>
    <li><a href="explore.html">Explore</a></li>
    <li><a href="manage.html" class="active">Itinerary</a></li>
    <li><a href="users.html">Profile</a></li>
    <li><a href="login.html">Log out</a></li>
  </ul>
</nav>

<div class="wrap">
  <section>
    <a class="back-link" href="manage.html">← Back to my trips</a>
    <h1 id="title">My Tokyo trip</h1>

    <div class="dates">
      <input type="date" id="startDate" aria-label="Start date">
      <span class="dash">–</span>
      <input type="date" id="endDate" aria-label="End date">
    </div>
    <div class="hint" id="dateHint">Days are generated from these dates.</div>

    <div class="days" id="days"></div>
    <div class="day-head" id="dayHead"></div>
    <div id="activities"></div>
  </section>

  <aside>
    <div class="total"><span>total price</span><strong id="total">¥0</strong></div>

    <div class="panel">
      <h2>add activity</h2>

      <div class="seg" id="seg">
        <button type="button" class="on" data-cat="place">Places</button>
        <button type="button" data-cat="food">Food</button>
      </div>

      <label for="placeSelect">Place name</label>
      <select id="placeSelect"></select>

      <label for="visitTime">Visit time</label>
      <input type="time" id="visitTime" value="09:00">

      <button class="add-btn" id="addBtn">add to day 1</button>
      <div class="form-err" id="formErr"></div>
    </div>
  </aside>
</div>

<script src="navbar.js"></script>
<script src="itinerary.js"></script>
</body>
</html>
