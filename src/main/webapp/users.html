<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Tokyo Go!</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">

    <!-- Shared Navbar CSS -->
    <link rel="stylesheet" href="navbar.css">

<link rel="stylesheet" href="users.css">

</head>


<body class="page">

    <!-- NAVBAR -->

    <header>

        <nav>

            <a class="logo" href="index.html">Tokyo<span>Go!</span></a>

            <!-- Hamburger Menu -->
            <button class="menu" id="menuBtn" type="button">
                ☰
            </button>

            <ul id="navLinks">

                <li><a href="index.html">Home</a></li>

                <li><a href="explore.html">Explore</a></li>

                <li><a href="itinerary.html">Itinerary</a></li>

                <li><a href="users.html" class="active">Profile</a></li>

                <li><a href="index.html">Log out</a></li>

            </ul>

        </nav>

    </header>


    <!-- PROFILE BANNER -->

    <section class="banner">
        <h1 id="bannerName">Your Profile</h1>
    </section>


    <!-- PROFILE DETAILS -->

    <main class="wrap">
        <div class="card">

            <h2>Account details</h2>
            <div class="underline"></div>

            <!-- NAME -->
            <div class="row">
                <div class="label">Name</div>
                <div class="value" id="name"></div>
                <input type="text" class="edit-input hidden" id="editName">
            </div>

            <!-- EMAIL -->
            <div class="row">
                <div class="label">Email</div>
                <div class="value" id="email"></div>
                <input type="email" class="edit-input hidden" id="editEmail">
            </div>

            <!-- PASSWORD -->
            <div class="row">
                <div class="label">Password</div>

                <div class="value" id="passwordSection">
                    <span id="password"></span>
                    <button class="toggle" id="togglePw" type="button">
                        Show
                    </button>
                </div>

                <input type="password"
                       class="edit-input hidden"
                       id="editPassword">
            </div>

            <!-- SAVE AND CANCEL -->
            <div class="edit-actions hidden" id="saveActions">

                <button class="btn-cancel-edit" id="cancelBtn" type="button">
                    Cancel
                </button>

                <button class="btn-save" id="saveBtn" type="button">
                    Save Changes
                </button>

            </div>

            <!-- DELETE ACCOUNT & EDIT PROFILE -->
            <div class="profile-actions">

                <button class="btn-delete" id="openDelete" type="button">
                    Remove account
                </button>

                <button class="btn-edit" id="editBtn" type="button">
                    Edit Profile
                </button>

            </div>

        </div>

    </main>

    <!-- EDIT PROFILE CONFIRMATION MODAL -->
    <div class="overlay" id="editOverlay"
         role="dialog" aria-modal="true">

        <div class="modal">

            <h3>Edit your profile?</h3>

            <p>Do you want to make changes to your account details?</p>

            <div class="actions">

                <button class="btn-cancel" id="cancelEdit" type="button">
                    Cancel
                </button>

                <button class="btn-edit" id="confirmEdit" type="button">
                    Yes, Edit
                </button>

            </div>

        </div>

    </div>


    <!-- DELETE CONFIRMATION MODAL -->

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <div class="modal">

            <h3 id="modalTitle">Delete your account?</h3>

            <p>You'll lose your profile and saved trips. This action can't be undone.</p>

            <div class="actions">

                <button class="btn-cancel" id="cancelDelete" type="button">
                    Cancel
                </button>

                <button class="btn-delete" id="confirmDelete" type="button">
                    Yes, delete
                </button>

            </div>

        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="users.js"></script>

</body>

</html>
