<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | Tokyo Go!</title>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">

    <!-- Shared Navbar CSS -->
    <link rel="stylesheet" href="navbar.css">

    <style>

        :root {
            --navy: #1e2150;
            --navy-dark: #151740;
            --red: #c8352f;
            --red-dark: #a62a25;
            --pink: #f4a6b8;
            --bg: #f3f0f7;
            --card: #ffffff;
            --text: #1e2150;
            --muted: #6b6b86;
            --line: #e2dded;

            /* Background photo: set this to the SAME image your other pages use */
            --hero-img: url("img/tokyo7.jpg");
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Photo shows in the area below the banner */
        body {
            font-family: "Zen Kaku Gothic New", "Segoe UI", system-ui, Arial, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                linear-gradient(180deg, rgba(21,23,64,.55) 0%, rgba(21,23,64,.4) 100%),
                var(--hero-img) center / cover no-repeat fixed,
                var(--bg); /* fallback if the photo is missing */
        }

        h1, h2, h3, .logo {
            font-family: "Shippori Mincho", Georgia, "Times New Roman", serif;
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
        }


        /* BANNER */

        .banner {
            background: linear-gradient(135deg, var(--navy-dark), var(--navy));
            color: #fff;
            padding: 48px 24px 90px;
            text-align: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin: 0 auto 16px;
            background: var(--red);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Shippori Mincho", Georgia, serif;
            font-size: 2.6rem;
            font-weight: 700;
            border: 4px solid var(--pink);
        }

        .banner h1 {
            font-size: 2.2rem;
        }

        .banner p {
            opacity: .75;
            margin-top: 6px;
        }


        /* PROFILE CARD */

        .wrap {
            max-width: 640px;
            margin: -56px auto 60px;
            padding: 0 20px;
        }

        .card {
            background: var(--card);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,.25);
        }

        .card h2 {
            font-size: 1.5rem;
            margin-bottom: 4px;
        }

        .underline {
            width: 60px;
            height: 4px;
            background: var(--red);
            border-radius: 2px;
            margin: 10px 0 26px;
        }

        .row {
            padding: 16px 0;
            border-bottom: 1px solid var(--line);
        }

        .row:last-of-type {
            border-bottom: none;
        }

        .label {
            font-size: .78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .value {
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            word-break: break-all;
        }

        .toggle {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--navy);
            border-radius: 999px;
            padding: 6px 14px;
            font-size: .8rem;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            flex-shrink: 0;
        }

        .toggle:hover {
            background: var(--navy);
            color: #fff;
            border-color: var(--navy);
        }


        /* DANGER ZONE */

        .danger {
            margin-top: 28px;
            padding: 20px;
            border-radius: 14px;
            background: #fdf1f0;
            border: 1px solid #f3c9c6;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .danger h3 {
            font-size: 1.1rem;
            color: var(--red-dark);
            margin-bottom: 6px;
        }

        .danger p {
            font-size: .9rem;
            color: #7a4a47;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .btn-delete {
            background: var(--red);
            color: #fff;
            border: none;
            border-radius: 999px;
            padding: 12px 26px;
            font-weight: 700;
            font-size: .95rem;
            cursor: pointer;
            font-family: inherit;
            transition: background .2s, transform .1s;
        }

        .btn-delete:hover {
            background: var(--red-dark);
        }

        .btn-delete:active {
            transform: scale(.97);
        }


        /* EDIT PROFILE */

        .btn-edit {
            background: var(--navy);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 24px;
            font-weight: 700;
            font-size: .9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-edit:hover {
            background: var(--navy-dark);
        }

        .edit-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-family: inherit;
            font-size: 1rem;
            color: var(--navy);
            outline: none;
        }

        .edit-input:focus {
            border-color: var(--navy);
        }

        .edit-actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
            justify-content: flex-end;
        }

        .profile-actions {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 28px;
        }

        .btn-save {
            background: var(--red);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 11px 22px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-save:hover {
            background: var(--red-dark);
        }

        .btn-cancel-edit {
            background: white;
            color: var(--navy);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 11px 22px;
            font-weight: 700;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }


        /* MODAL */

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(21,23,64,.6);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        .overlay.show {
            display: flex;
        }

        .navy-popup {
            border: 2px solid #F28C28;
            border-radius: 20px;
        }

        .orange-button {
            color: #0B1F3A !important;
            font-weight: bold !important;
            border-radius: 8px !important;
        }

        .modal {
            background: #fff;
            border-radius: 18px;
            padding: 28px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .modal h3 {
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .modal p {
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 22px;
        }

        .modal .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-cancel {
            background: transparent;
            color: var(--navy);
            border: 1px solid var(--navy);
            border-radius: 999px;
            padding: 12px 26px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-cancel:hover {
            background: var(--navy);
            color: #fff;
        }


        @media (max-width: 600px) {

            .card {
                padding: 22px;
            }

        }

    </style>

</head>


<body class="page">

    <!-- NAVBAR -->

    <header>

        <nav>

            <a class="logo" href="index.html">Tokyo<span>Go!</span></a>

            <!-- Hamburger Menu -->
            <button class="menu" id="menuBtn" type="button">
                ☰
            </button>

            <ul id="navLinks">

                <li><a href="index.html">Home</a></li>

                <li><a href="explore.html">Explore</a></li>

                <li><a href="itinerary.html">Itinerary</a></li>

                <li><a href="users.html" class="active">Profile</a></li>

                <li><a href="index.html">Log out</a></li>

            </ul>

        </nav>

    </header>


    <!-- PROFILE BANNER -->

    <section class="banner">
        <h1 id="bannerName">Your Profile</h1>
    </section>


    <!-- PROFILE DETAILS -->

    <main class="wrap">
        <div class="card">

            <h2>Account details</h2>
            <div class="underline"></div>

            <!-- NAME -->
            <div class="row">
                <div class="label">Name</div>
                <div class="value" id="name"></div>
                <input type="text" class="edit-input hidden" id="editName">
            </div>

            <!-- EMAIL -->
            <div class="row">
                <div class="label">Email</div>
                <div class="value" id="email"></div>
                <input type="email" class="edit-input hidden" id="editEmail">
            </div>

            <!-- PASSWORD -->
            <div class="row">
                <div class="label">Password</div>

                <div class="value" id="passwordSection">
                    <span id="password"></span>
                    <button class="toggle" id="togglePw" type="button">
                        Show
                    </button>
                </div>

                <input type="password"
                       class="edit-input hidden"
                       id="editPassword">
            </div>

            <!-- SAVE AND CANCEL -->
            <div class="edit-actions hidden" id="saveActions">

                <button class="btn-cancel-edit" id="cancelBtn" type="button">
                    Cancel
                </button>

                <button class="btn-save" id="saveBtn" type="button">
                    Save Changes
                </button>

            </div>

            <!-- DELETE ACCOUNT & EDIT PROFILE -->
            <div class="profile-actions">

                <button class="btn-delete" id="openDelete" type="button">
                    Remove account
                </button>

                <button class="btn-edit" id="editBtn" type="button">
                    Edit Profile
                </button>

            </div>

        </div>

    </main>

    <!-- EDIT PROFILE CONFIRMATION MODAL -->
    <div class="overlay" id="editOverlay"
         role="dialog" aria-modal="true">

        <div class="modal">

            <h3>Edit your profile?</h3>

            <p>Do you want to make changes to your account details?</p>

            <div class="actions">

                <button class="btn-cancel" id="cancelEdit" type="button">
                    Cancel
                </button>

                <button class="btn-edit" id="confirmEdit" type="button">
                    Yes, Edit
                </button>

            </div>

        </div>

    </div>


    <!-- DELETE CONFIRMATION MODAL -->

    <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">

        <div class="modal">

            <h3 id="modalTitle">Delete your account?</h3>

            <p>You'll lose your profile and saved trips. This action can't be undone.</p>

            <div class="actions">

                <button class="btn-cancel" id="cancelDelete" type="button">
                    Cancel
                </button>

                <button class="btn-delete" id="confirmDelete" type="button">
                    Yes, delete
                </button>

            </div>

        </div>

    </div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // USER DATA
    let user = JSON.parse(localStorage.getItem("user") || "null") || {
        name: "Aiman Hakim",
        email: "aiman@example.com",
        password: "mypassword123"
    };


    // ELEMENTS

    const nameEl = document.getElementById("name");
    const emailEl = document.getElementById("email");
    const pwEl = document.getElementById("password");

    const editName = document.getElementById("editName");
    const editEmail = document.getElementById("editEmail");
    const editPassword = document.getElementById("editPassword");

    const editBtn = document.getElementById("editBtn");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");

    const saveActions = document.getElementById("saveActions");
    const profileActions = document.querySelector(".profile-actions");

    const passwordSection = document.getElementById("passwordSection");

    const editOverlay = document.getElementById("editOverlay");
    const overlay = document.getElementById("overlay");

    let showPw = false;


    // DISPLAY PROFILE

    function displayProfile() {

        nameEl.textContent = user.name;
        emailEl.textContent = user.email;

        document.getElementById("bannerName").textContent = user.name;

        renderPw();

    }


    // SHOW / HIDE PASSWORD

    function renderPw() {

        pwEl.textContent = showPw
            ? user.password
            : "•".repeat(Math.max(user.password.length, 8));

        document.getElementById("togglePw").textContent =
            showPw ? "Hide" : "Show";

    }

    document.getElementById("togglePw").addEventListener("click", () => {

        showPw = !showPw;
        renderPw();

    });


    // EDIT PROFILE CONFIRMATION

    editBtn.addEventListener("click", () => {

        editOverlay.classList.add("show");

    });


    // CANCEL EDIT CONFIRMATION

    document.getElementById("cancelEdit").addEventListener("click", () => {

        editOverlay.classList.remove("show");

    });


    // CONFIRM EDIT

    document.getElementById("confirmEdit").addEventListener("click", () => {

        editOverlay.classList.remove("show");

        startEditProfile();

    });


    // START EDIT PROFILE

    function startEditProfile() {

        // Put current information into input fields
        editName.value = user.name;
        editEmail.value = user.email;
        editPassword.value = user.password;

        // Hide original profile details
        nameEl.classList.add("hidden");
        emailEl.classList.add("hidden");
        passwordSection.classList.add("hidden");

        // Show editable input fields
        editName.classList.remove("hidden");
        editEmail.classList.remove("hidden");
        editPassword.classList.remove("hidden");

        // Hide Remove Account and Edit Profile buttons
        profileActions.classList.add("hidden");

        // Show Save Changes and Cancel buttons
        saveActions.classList.remove("hidden");

    }


    // SAVE CHANGES
    saveBtn.addEventListener("click", () => {

        const newName = editName.value.trim();
        const newEmail = editEmail.value.trim();
        const newPassword = editPassword.value;

        // Check empty fields
        if (newName === "" || newEmail === "" || newPassword === "") {
            Swal.fire({
                title: "Oops!",
                text: "Please fill in all fields.",
                icon: "warning",
                confirmButtonColor: "#F28C28",
                background: "#0B1F3A",
                color: "#FFFFFF",
                iconColor: "#F28C28"
            });
            return;
        }

        // Validate email
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(newEmail)) {
            Swal.fire({
                title: "Invalid Email!",
                text: "Please enter a valid email address.",
                icon: "error",
                confirmButtonColor: "#F28C28",
                background: "#0B1F3A",
                color: "#FFFFFF",
                iconColor: "#F28C28"
            });
            return;
        }

        // Update user information
        user.name = newName;
        user.email = newEmail;
        user.password = newPassword;

        // Save information in localStorage
        localStorage.setItem("user", JSON.stringify(user));

        // Update profile display
        displayProfile();

        // Return to main profile
        exitEditMode();

        // Success popup
        Swal.fire({
            title: "Profile Updated!",
            text: "Your profile has been updated successfully.",
            icon: "success",
            confirmButtonText: "OK",
            confirmButtonColor: "#F28C28",
            background: "#0B1F3A",
            color: "#FFFFFF",
            iconColor: "#F28C28",
            customClass: {
                popup: "navy-popup",
                confirmButton: "orange-button"
            }
        });

    });


    // CANCEL EDIT

    cancelBtn.addEventListener("click", () => {

        // Discard unsaved changes (localStorage is not updated)
        displayProfile();
        exitEditMode();

    });


    // EXIT EDIT MODE

    function exitEditMode() {

        // Show original profile details
        nameEl.classList.remove("hidden");
        emailEl.classList.remove("hidden");
        passwordSection.classList.remove("hidden");

        // Hide editable input fields
        editName.classList.add("hidden");
        editEmail.classList.add("hidden");
        editPassword.classList.add("hidden");

        // Hide Save Changes and Cancel buttons
        saveActions.classList.add("hidden");

        // Show Remove Account and Edit Profile buttons
        profileActions.classList.remove("hidden");

    }


    // INITIAL DISPLAY

    displayProfile();


    // DELETE ACCOUNT MODAL

    document.getElementById("openDelete").addEventListener("click", () => {

        overlay.classList.add("show");

    });

    document.getElementById("cancelDelete").addEventListener("click", () => {

        overlay.classList.remove("show");

    });

    overlay.addEventListener("click", (e) => {

        if (e.target === overlay) {

            overlay.classList.remove("show");

        }

    });

    document.getElementById("confirmDelete").addEventListener("click", () => {

        localStorage.removeItem("user");

        window.location.href = "index.html";

    });


    // HAMBURGER MENU

    const menuBtn = document.getElementById("menuBtn");
    const navLinks = document.getElementById("navLinks");

    menuBtn.addEventListener("click", () => {

        navLinks.classList.toggle("open");

    });


</script>

</body>

</html>
