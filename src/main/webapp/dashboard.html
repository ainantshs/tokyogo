<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Tokyo Go!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard.css">
<script src="dashboard.js" defer></script>
</head>
<body>

<header class="top">
  <a class="logo" href="index.html" aria-label="Tokyo Go home">Tokyo<span>Go!</span></a>
  <nav aria-label="Admin">
    <a href="dashboard.html" aria-current="page">dashboard</a>
    <a href="attraction.html">attractions</a>
    <a href="users.html">users</a>
    <a href="login.html">log out</a>
  </nav>
</header>

<main class="wrap">
  <h1 class="sr">Dashboard</h1>
  <section class="stats" aria-label="Totals">
    <div class="stat">
      <strong id="n-users">0</strong>
      <span>no. of users</span>
    </div>
    <div class="stat">
      <strong id="n-trips">0</strong>
      <span>no. of trips</span>
    </div>
    <div class="stat">
      <strong id="n-places">0</strong>
      <span>no. of places</span>
    </div>
  </section>

  <section class="trips" aria-labelledby="trips-title">
    <h2 id="trips-title">latest trips list</h2>

    <div class="cols" aria-hidden="true">
      <span>user name</span>
      <span>itinerary plan</span>
      <span>start date – end date</span>
      <span>total price</span>
      <span></span>
    </div>

    <ul id="trip-list"></ul>
  </section>

</main>
</body>
</html>
